<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Landing Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav>
      <div class="logo">YourLogo</div>
      <a href="#cta" class="nav-cta">Get Started</a>
    </nav>

    <!-- Hero Section -->
    <section id="hero">
      <h1>Headline that hooks visitors</h1>
      <p>Sub-headline explaining the benefit</p>
      <a href="#" class="cta-button">Claim Your Free Trial →</a>
    </section>

    <!-- Features/Benefits -->
    <section id="features">
      <h2>Why choose us</h2>
      <div class="feature-grid">
        <div class="feature">Feature 1</div>
        <div class="feature">Feature 2</div>
        <div class="feature">Feature 3</div>
      </div>
    </section>

    <!-- Social Proof -->
    <section id="testimonials">
      <blockquote>"Amazing product!"</blockquote>
      <cite>- Happy Customer</cite>
    </section>

    <!-- Final CTA -->
    <section id="cta">
      <h2>Ready to get started?</h2>
      <a href="#" class="cta-button">Sign Up Now</a>
    </section>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 Your Company</p>
    </footer>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js"></script>
  </body>
</html>
